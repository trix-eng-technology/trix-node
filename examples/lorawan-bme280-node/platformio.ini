; LoRaWAN reference node on the TRIX IoT standard: Heltec WiFi LoRa 32 V2
; (ESP32 + SX1276) with a BME280 on I2C. The node sends a 10-byte binary
; payload; ChirpStack decodes it with codec/trix-lorawan-bme280.js into
; standard key names and forwards it to TRIX.
;
;   cp include/lorawan_keys.example.h include/lorawan_keys.h   then fill in
;   pio run -e heltec_wifi_lora_32_V2              build
;   pio run -e heltec_wifi_lora_32_V2 -t upload    flash by cable
;   pio test -e native                             host test of the payload encoder
;   node --test codec/test.mjs                          codec test (same vectors)

[platformio]
default_envs = heltec_wifi_lora_32_V2

[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.7.1
    adafruit/Adafruit BME280 Library@^2.2.4
build_flags =
    -DFW_TYPE=\"lorawan-bme280-node\"
    -DFW_VERSION=\"1.0.0\"
    ; Region: AS923 is AS923-1 (Thailand). Other values: EU868 US915 AU915 AS923_2 ...
    -DLORAWAN_BAND=AS923
    ; Sub-band only matters for US915/AU915; 0 elsewhere.
    -DLORAWAN_SUBBAND=0
    ; BME280 shares the OLED I2C bus (SDA 4, SCL 15) and is powered from 3V3.
    -DBME_SDA=4
    -DBME_SCL=15
    ; Battery sense: GPIO37 behind a 220k/100k divider on V2. Set BAT_ADC_PIN=-1
    ; if the board has no divider; the node then reports no battery value.
    -DBAT_ADC_PIN=37
    -DBAT_DIVIDER=3.2f

[env:native]
platform = native
build_flags = -std=c++17
test_build_src = no
