; Example node on the TRIX IoT standard: BME280 on I2C, protocol trix-node/1.
; Copy this folder to start a new device, then change FW_TYPE and the sensor code.
;
;   pio run -e esp32dev            build
;   pio run -e esp32dev -t upload  flash by cable (first time)
;   pio test -e native             host test of the OTA token check

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../../TrixNode
    adafruit/Adafruit BME280 Library@^2.2.4
build_flags =
    -DFW_TYPE=\"bme280-node\"
    -DFW_VERSION=\"1.0.0\"

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:native]
platform = native
framework =
lib_deps =
    symlink://../../TrixNode
    bblanchon/ArduinoJson@^7.2.0
    rweather/Crypto@^0.4.0
; Crypto is installed but not built as a library here: test/test_token/
; crypto_host.cpp compiles the Ed25519 units without Arduino.h.
lib_ignore = PubSubClient, Crypto
lib_compat_mode = off
build_flags = -std=c++17 -I${platformio.workspace_dir}/libdeps/native/Crypto
test_build_src = no
